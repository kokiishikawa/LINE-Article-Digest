name: Deploy to Lambda

on:
  push:
    branches:
      - develop # developブランチにpushされたら発火

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4 # Actions環境に
      
      - name: Pythonファイルをzipに格納
        run: zip function.zip lambda_function.py scraper.py bedrock_client.py line_client.py # Pythonファイルをzipに格納

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::315208930945:role/line-article-digest-github-actions-role
          aws-region: ap-northeast-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name line-article-digest \
            --zip-file fileb://function.zip